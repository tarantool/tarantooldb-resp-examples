credentials:
  users:
    # Demo credentials, do NOT use in production.
    replicator:
      password: 'topsecret'
      roles: [ replication ]
      privileges:
        - permissions: [ execute ]
          lua_call: [ 'failover.execute' ]

iproto:
  advertise:
    peer:
      login: replicator

replication:
  failover: supervised

stateboard:
  enabled: true

roles: ["tdb_redis_role", "tdb_redis_sentinel"]

groups:
  group001:
    replicasets:
      storages001:
        instances:
          instance001:
            roles_cfg:
              tdb_redis_role:
                port: 6379
              tdb_redis_sentinel:
                port: 26379
            iproto:
              listen:
                - uri: 'tdbredis-1:3301'
          instance002:
            roles_cfg:
              tdb_redis_role:
                port: 6380
              tdb_redis_sentinel:
                port: 26380
            iproto:
              listen:
                - uri: 'tdbredis-2:3302'
          instance003:
            roles_cfg:
              tdb_redis_role:
                port: 6381
              tdb_redis_sentinel:
                port: 26381
            iproto:
              listen:
                - uri: 'tdbredis-3:3303'
