credentials:
  users:
    # Demo credentials, do NOT use in production.
    sampleuser:
      password: '123456'
      privileges:
        - permissions: [ read, write ]
          spaces: [ config_storage, config_storage_meta ]
        - permissions: [ execute ]
          universe: true
    replicator:
      password: 'topsecret'
      roles: [ replication ]

iproto:
  advertise:
    peer:
      login: replicator

replication:
  failover: election

database:
  use_mvcc_engine: true

groups:
  group001:
    replicasets:
      replicaset001:
        roles: [ config.storage ]
        roles_cfg:
          config.storage:
            status_check_interval: 3
        instances:
          instance001:
            iproto:
              listen:
                - uri: 'config-storage-1:4401'
          instance002:
            iproto:
              listen:
                - uri: 'config-storage-2:4402'
          instance003:
            iproto:
              listen:
                - uri: 'config-storage-3:4403'
